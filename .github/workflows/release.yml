name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        default: stable
        options:
          - stable
          - nightly
      version:
        description: Stable version (defaults to apps/server/package.json)
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'stable' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  T3CODE_DESKTOP_UPDATE_REPOSITORY: golitedev/t3privacy

jobs:
  preflight:
    name: Resolve fork release
    if: github.repository == 'golitedev/t3privacy'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_channel: ${{ steps.meta.outputs.release_channel }}
      ref: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            .github/scripts
            apps/server/package.json
          sparse-checkout-cone-mode: false
      - name: Resolve version and reject published releases
        id: meta
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const { resolveRelease } = require('./.github/scripts/fork-release.cjs');
            const metadata = resolveRelease({
              tag: context.eventName === 'push' ? context.ref.replace('refs/tags/', '') : undefined,
              channel: process.env.RELEASE_CHANNEL || 'stable',
              version: process.env.RELEASE_VERSION || require('./apps/server/package.json').version,
              runNumber: context.runNumber,
              date: new Date().toISOString().slice(0, 10).replaceAll('-', ''),
            });
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: metadata.tag });
              if (!data.draft) throw new Error(`${metadata.tag} is already published; use a new version.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            for (const [key, value] of Object.entries(metadata)) core.setOutput(key, value);

  build_bundle:
    name: Build server, web and desktop bundle
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - name: Align release versions
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
      - name: Test release metadata and installers
        run: |
          node --test .github/scripts/fork-release.test.cjs
          (cd scripts && ../node_modules/.bin/vp test run --config ../vite.config.ts install.test.ts)
          (cd packages/shared && ../../node_modules/.bin/vp test run --config ../../vite.config.ts src/cliRelease.test.ts)
          (cd apps/server && ../../node_modules/.bin/vp test run src/cloud/npmRelease.test.ts src/cli/update.test.ts)
      - name: Build JS bundle
        run: vp run build:desktop:bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: true
      # desktop_mac_x64 saves the shared pnpm store; this job finishes last.
      save_pnpm_store: false

  desktop_mac_x64:
    name: Desktop macOS x64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      label: macOS x64
      runner: macos-15-intel
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      # No CLI archive: Node single-executables are unsupported on x64 macOS
      # (the SEA docs list macOS as arm64 only) and the built binary segfaults
      # on start. The x64 desktop app is Electron and unaffected.
      cli_archive: false

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  # node-pty has no Linux prebuild and compiles from source, so the arm64 app
  # and archive are built on arm64 hardware rather than cross-built.
  desktop_linux_arm64:
    name: Desktop Linux arm64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      label: Linux arm64
      runner: ubuntu-24.04-arm
      platform: linux
      target: AppImage
      arch: arm64
      rust_target: aarch64-unknown-linux-gnu
      resource_key: linux-arm64
      cli_archive: true

  # The Windows jobs start with the other platforms and wait for the same-arch
  # Linux CLI archive after their other setup. Packaging is mostly CPU and
  # small-file work, which Linux runners do faster than Windows ones, so both
  # Windows targets build and sign on Linux and only the native checks run on
  # Windows.
  desktop_win_x64:
    name: Desktop Windows x64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  desktop_win_arm64:
    name: Desktop Windows arm64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      label: Windows arm64
      runner: ubuntu-24.04
      verify_runner: windows-11-arm
      platform: win
      target: nsis
      arch: arm64
      rust_target: aarch64-pc-windows-msvc
      resource_key: win32-arm64
      cli_archive: true

  release:
    name: Publish fork release
    needs:
      - preflight
      - desktop_mac_arm64
      - desktop_mac_x64
      - desktop_linux_x64
      - desktop_linux_arm64
      - desktop_win_x64
      - desktop_win_arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...
      - name: Download desktop installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Download CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets
      - name: Merge desktop update manifests
        run: node scripts/merge-release-update-manifests.ts release-assets
      - name: Stage installers and compatibility metadata
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cp scripts/install.sh scripts/install.ps1 release-assets/
          node - <<'NODE'
          const fs = require('node:fs');
          const { releaseManifest } = require('./.github/scripts/fork-release.cjs');
          const manifest = releaseManifest(process.env.RELEASE_VERSION, fs.readdirSync('apps/server/src/persistence/Migrations'));
          fs.writeFileSync('release-assets/release.json', JSON.stringify(manifest) + '\n');
          NODE
          cd release-assets
          sha256sum t3-*.tar.gz t3-*.zip install.sh install.ps1 release.json > SHA256SUMS
      - name: Publish after all platform checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.preflight.outputs.release_channel }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.ref }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Install the CLI on Linux or Apple Silicon macOS:

          ```sh
          curl -fsSL https://github.com/golitedev/t3privacy/releases/latest/download/install.sh | sh
          ```

          Windows PowerShell:

          ```powershell
          irm https://github.com/golitedev/t3privacy/releases/latest/download/install.ps1 | iex
          ```

          These commands install the latest stable fork release. Set `T3CODE_CHANNEL=nightly` to select a published nightly. Desktop installers are attached below. macOS and Windows builds are unsigned unless signing credentials are configured.

          This fork removes product telemetry and hosted connectivity. Remote devices pair directly over the LAN. The command remains `t3`; existing projects and threads are kept under `~/.t3`.
          NOTES
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$RELEASE_COMMIT" \
              --title "T3 Privacy v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$RELEASE_CHANNEL" == stable ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          fi
